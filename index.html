    border-color: var(--primary);
}

.zone-item::before {
    content: '';

    inset: 0;
    background: var(--primary-light);

    z-index: 1;

    to { transform: translateY(0); }

    color: white;

#zoneAuthor:hover { color: white; text-decoration: underline; }

#popupOverlay {

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.popup {
    background: var(--surface);
    border-radius: var(--radius-lg);

}

@keyframes slideInScale {
    from { transform: scale(0.9) translateY(20px); opacity: 0; }
    to { transform: scale(1) translateY(0); opacity: 1; }
}

.popup-header {
    background: var(--gradient-primary);
    color: white;
    padding: 1.25rem 1.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
}

#popupTitle { margin: 0; font-size: 1.25rem; font-weight: 700; }

#popupClose {

}

#popupBody input[type="text"],
#popupBody input[type="file"] {
    width: 100%;

    color: var(--text);
    font-size: 15px;

}

#popupBody input[type="text"]:focus,
#popupBody input[type="file"]:focus {
    border-color: var(--primary);

.play-stat-card {

.play-stat-label { font-size: 11px; color: var(--text-muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
.play-stat-value { font-size: 22px; font-weight: 700; color: var(--primary); margin-top: 4px; }

    .zone-item button { padding: 1rem 0.75rem; min-height: 65px; font-size: 13px; }
    .footer-links { gap: 1.5rem; }

@media (max-width: 480px) {
    #container, #featuredZones { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 1rem; }

<script>
const container = document.getElementById('container');
const zoneViewer = document.getElementById('zoneViewer');
let zoneFrame = document.getElementById('zoneFrame');
const searchBar = document.getElementById('searchBar');
const sortOptions = document.getElementById('sortOptions');
const filterOptions = document.getElementById('filterOptions');

const zonesurls = [
    "https://cdn.jsdelivr.net/gh/freebuisness/assets@main/zones.json",
    "https://cdn.jsdelivr.net/gh/freebuisness/assets@latest/zones.json",
    "https://cdn.jsdelivr.net/gh/freebuisness/assets@master/zones.json",
    "https://cdn.jsdelivr.net/gh/freebuisness/assets/zones.json"
];
let zonesURL = zonesurls[Math.floor(Math.random() * zonesurls.length)];
const coverURL = "https://cdn.jsdelivr.net/gh/freebuisness/covers@main";
const htmlURL = "https://cdn.jsdelivr.net/gh/freebuisness/html@main";
let zones = [];
let popularityData = {};
const featuredContainer = document.getElementById('featuredZones');

// ─── GAME PROGRESS: SAVE SYSTEM v3 ───────────────────────────────────────────
// THE REAL PROBLEM:
// Games run as injected HTML in an iframe. Their localStorage is sandboxed to
// the iframe's document context, which is destroyed when the tab closes or the
// iframe is removed. RAM variables die immediately. localStorage in the iframe
// context also dies because it has no persistent origin — it's about:blank.
//
// THE ACTUAL FIX:
// 1. Inject a proxy that overrides window.localStorage in the game iframe,
//    routing ALL reads/writes through postMessage to the PARENT window.
// 2. Parent holds the real localStorage under the site's own persistent origin.
// 3. Parent snapshots the iframe's full localStorage state every 3 seconds
//    AND on beforeunload — so even games that batch-write only at session end
//    are captured.
// 4. On next openZone(), parent pre-seeds the proxy cache with saved data
//    BEFORE the game's own scripts execute — so games read their saved state.
//
// This covers: games that call localStorage, games that batch-write, and
// games that write frequently. RAM-only games (no localStorage calls at all)
// cannot be saved by any client-side approach without modifying game source.

let _activeZoneId = null;
let _snapshotTimer = null;

// Parent-side postMessage handler
window.addEventListener('message', function(e) {
    if (!e.data || e.data.__pz_type !== 'storage_op') return;
    const { zoneId, op, key, value, reqId } = e.data;
    const NS = 'gs_' + zoneId + '_';
    let result = null;
    try {
        switch(op) {
            case 'setItem':
                localStorage.setItem(NS + key, String(value));
                break;
            case 'getItem':
                result = localStorage.getItem(NS + key);
                break;
            case 'removeItem':
                localStorage.removeItem(NS + key);
                break;
            case 'clear':
                for (let i = localStorage.length - 1; i >= 0; i--) {
                    const k = localStorage.key(i);
                    if (k && k.startsWith(NS)) localStorage.removeItem(k);
                }
                break;
            case 'snapshot':
                // Game reporting full current state — merge into parent localStorage.
                if (value && typeof value === 'object') {
                    for (let i = localStorage.length - 1; i >= 0; i--) {
                        const k = localStorage.key(i);
                        if (k && k.startsWith(NS)) localStorage.removeItem(k);
                    }
                    for (const [k, v] of Object.entries(value)) {
                        if (k && !k.startsWith('play_') && !k.startsWith('gs_') && k !== 'p') {
                            localStorage.setItem(NS + k, String(v));
                        }
                    }
                }
                break;
        }
    } catch(err) {}
    if (reqId !== undefined && e.source) {
        try { e.source.postMessage({ __pz_type: 'storage_reply', reqId, result }, '*'); } catch(err) {}
    }
});

// Ask the iframe to send a snapshot of its current localStorage right now
function requestSnapshot() {
    try {
        if (zoneFrame && zoneFrame.contentWindow) {
            zoneFrame.contentWindow.postMessage({ __pz_type: 'snapshot_request' }, '*');
        }
    } catch(e) {}
}

// Start polling for snapshots every 3 seconds while a game is open
function startSnapshotPolling() {
    stopSnapshotPolling();
    _snapshotTimer = setInterval(requestSnapshot, 3000);
}

function stopSnapshotPolling() {
    if (_snapshotTimer) { clearInterval(_snapshotTimer); _snapshotTimer = null; }
}

// On tab close/refresh — grab one final snapshot synchronously
window.addEventListener('beforeunload', function() {
    requestSnapshot();
});

function getSavedGameData(zoneId) {
    // Read saved data for this zone from parent localStorage synchronously.
    // Returns a plain object of { key: value } pairs, no namespace prefix.
    const ns = 'gs_' + zoneId + '_';
    const data = {};
    for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(ns)) {
            data[k.slice(ns.length)] = localStorage.getItem(k);
        }
    }
    return data;
}

function buildLocalStorageProxy(zoneId, savedData) {
    // savedData is embedded as a JSON literal — cache is populated at parse
    // time, before any game script executes. Zero async, zero race condition.
    const seedJson = JSON.stringify(savedData || {});
    return `<script>
(function() {
    var NS = '${zoneId}';

    // Pre-seeded synchronously from parent localStorage at inject time.
    // Game reads localStorage.getItem('save') and gets the real value instantly.
    var _cache = ${seedJson};

    window.addEventListener('message', function(e) {
        if (!e.data) return;
        // Parent polling for a snapshot
        if (e.data.__pz_type === 'snapshot_request') {
            var snap = {};
            for (var k in _cache) { if (_cache.hasOwnProperty(k)) snap[k] = _cache[k]; }
            window.parent.postMessage({
                __pz_type: 'storage_op', zoneId: NS, op: 'snapshot', value: snap
            }, '*');
        }
    });

    function send(op, key, value) {
        // Real-time write to parent localStorage on every setItem — no timer needed.
        window.parent.postMessage({
            __pz_type: 'storage_op', zoneId: NS, op: op, key: key, value: value
        }, '*');
    }

    var proxyStorage = {
        setItem: function(k, v) {
            // 1. Update local cache immediately (sync reads stay fast)
            _cache[k] = String(v);
            // 2. Persist to parent localStorage in real time
            send('setItem', k, String(v));
        },
        getItem: function(k) {
            return _cache.hasOwnProperty(k) ? _cache[k] : null;
        },
        removeItem: function(k) {
            delete _cache[k];
            send('removeItem', k);
        },
        clear: function() {
            _cache = {};
            send('clear');
        },
        key: function(idx) {
            var keys = Object.keys(_cache);
            return keys[idx] !== undefined ? keys[idx] : null;
        },
        get length() { return Object.keys(_cache).length; }
    };

    // Final snapshot on iframe unload — catches any batched writes
    window.addEventListener('beforeunload', function() {
        var snap = {};
        for (var k in _cache) { if (_cache.hasOwnProperty(k)) snap[k] = _cache[k]; }
        window.parent.postMessage({
            __pz_type: 'storage_op', zoneId: NS, op: 'snapshot', value: snap
        }, '*');
    });

    // Override localStorage before any game script can touch it
    try {
        Object.defineProperty(window, 'localStorage', {
            get: function() { return proxyStorage; },
            configurable: true
        });
    } catch(e) {
        window.localStorage = proxyStorage;
    }
})();
<\/script>`;
}

function getGameProgressKeys(zoneId) {
    const ns = `gs_${zoneId}_`;
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(ns)) keys.push(k.slice(ns.length));
    }
    return keys;
}

function hasGameProgress(zoneId) {
    return getGameProgressKeys(zoneId).length > 0;
}

function clearGameProgress(zoneId) {
    const ns = `gs_${zoneId}_`;
    const toRemove = [];
    for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (k && k.startsWith(ns)) toRemove.push(k);
    }
    toRemove.forEach(k => localStorage.removeItem(k));
}

// ─── PLAY TRACKING ────────────────────────────────────────────────────────────

function recordPlay(id, name) {
    const key = `play_${id}`;
    const existing = JSON.parse(localStorage.getItem(key) || "null");
    const now = Date.now();
    const entry = existing ?? { id, name, count: 0, first: now, last: null };
    entry.count++;
    entry.last = now;
    localStorage.setItem(key, JSON.stringify(entry));
}

function getPlayStats() {
    const stats = [];
    for (let i = 0; i < localStorage.length; i++) {
        const k = localStorage.key(i);
        if (!k || !k.startsWith("play_")) continue;
        try {
            stats.push(JSON.parse(localStorage.getItem(k)));
        } catch(e) {}
    }
    return stats.sort((a, b) => b.count - a.count);
}

function getLocalPlay(id) {
    try {
        return JSON.parse(localStorage.getItem(`play_${id}`) || "null");
    } catch(e) {
        return null;
    }
}

function getTotalPlayCount() {
    return getPlayStats().reduce((sum, s) => sum + s.count, 0);
}

function getMostPlayed() {
    const stats = getPlayStats();
    return stats.length ? stats[0] : null;
}

function showPlayHistory() {
    closePopup();
    const stats = getPlayStats();
    const total = getTotalPlayCount();
    const mostPlayed = getMostPlayed();
    document.getElementById('popupTitle').textContent = "Your Play History";
    const popupBody = document.getElementById('popupBody');

    let summaryHtml = `
        <div class="play-stats-grid">
            <div class="play-stat-card">
                <div class="play-stat-label">Total Plays</div>
                <div class="play-stat-value">${total}</div>
            </div>
            <div class="play-stat-card">
                <div class="play-stat-label">Games Played</div>
                <div class="play-stat-value">${stats.length}</div>
            </div>
            <div class="play-stat-card">
                <div class="play-stat-label">Favourite</div>
                <div class="play-stat-value" style="font-size:13px;padding-top:6px;">${mostPlayed ? mostPlayed.name : '—'}</div>
            </div>
        </div>
    `;

    if (!stats.length) {
        popupBody.innerHTML = summaryHtml + `<p class="play-history-empty">No plays recorded yet. Go play something.</p>`;
    } else {
        const rows = stats.map((s, i) => {
            const lastDate = s.last ? new Date(s.last).toLocaleDateString('en-GB', { day:'numeric', month:'short', year:'numeric' }) : '—';
            const hasSave = hasGameProgress(s.id);
            return `
                <div class="play-history-row">
                    <span style="color:var(--text-muted);font-size:12px;margin-right:10px;">#${i+1}</span>
                    <span class="play-history-name">${s.name}</span>
                    <span style="font-size:12px;margin:0 8px;" title="${hasSave ? 'Has saved progress' : 'No saved progress'}">${hasSave ? '💾' : ''}</span>
                    <span class="play-history-count">${s.count}×</span>
                    <span class="play-history-date">${lastDate}</span>
                </div>`;
        }).join('');
        popupBody.innerHTML = summaryHtml + `<div style="margin-top:0.5rem;">${rows}</div>`;
    }

    popupBody.contentEditable = false;
    document.getElementById('popupOverlay').style.display = "flex";
}

// ─── END PLAY TRACKING ────────────────────────────────────────────────────────

function toTitleCase(str) {
    return str.replace(/\w\S*/g, text => text.charAt(0).toUpperCase() + text.substring(1).toLowerCase());
}

async function listZones() {
    try {
        let sharesponse, shajson, sha;
        try {
            sharesponse = await fetch("https://api.github.com/repos/freebuisness/assets/commits?t=" + Date.now());
        } catch(error) {}
        if (sharesponse && sharesponse.status === 200) {
            try {
                shajson = await sharesponse.json();
                sha = shajson[0]['sha'];
                if (sha) zonesURL = `https://cdn.jsdelivr.net/gh/freebuisness/assets@${sha}/zones.json`;
            } catch(error) {
                try {
                    let secondarysharesponse = await fetch("https://raw.githubusercontent.com/freebuisness/xml/refs/heads/main/sha.txt?t=" + Date.now());
                    if (secondarysharesponse && secondarysharesponse.status === 200) {
                        sha = (await secondarysharesponse.text()).trim();
                        if (sha) zonesURL = `https://cdn.jsdelivr.net/gh/freebuisness/assets@${sha}/zones.json`;
                    }
                } catch(error) {}
            }
        }
        const response = await fetch(zonesURL + "?t=" + Date.now());
        const json = await response.json();
        zones = json;
        zones[0].featured = true;
        await Promise.all([fetchPopularity("year"), fetchPopularity("month"), fetchPopularity("week"), fetchPopularity("day")]);
        sortZones();
        try {
            const search = new URLSearchParams(window.location.search);
            const id = search.get('id');
            const embed = window.location.hash.includes("embed");
            if (id) {
                const zone = zones.find(zone => zone.id + '' == id + '');
                if (zone) {
                    if (embed) {
                        if (zone.url.startsWith("http")) {
                            window.open(zone.url, "_blank");
                        } else {
                            const url = zone.url.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
                            fetch(url + "?t=" + Date.now()).then(response => response.text()).then(html => {
                                document.documentElement.innerHTML = html;
                                const popup = document.createElement("div");
                                popup.style.cssText = "position:fixed;bottom:20px;right:20px;background:#cce5ff;color:#004085;padding:10px;border:1px solid #b8daff;border-radius:5px;box-shadow:0px 0px 10px rgba(0,0,0,0.1);font-family:Arial,sans-serif;";
                                popup.innerHTML = `Play more games at <a href="https://gn-math.dev" target="_blank" style="color:#004085;font-weight:bold;">https://gn-math.dev</a>!`;
                                const closeBtn = document.createElement("button");
                                closeBtn.innerText = "?";
                                closeBtn.style.cssText = "margin-left:10px;background:none;border:none;cursor:pointer;color:#004085;font-weight:bold;";
                                closeBtn.onclick = () => popup.remove();
                                popup.appendChild(closeBtn);
                                document.body.appendChild(popup);
                                document.documentElement.querySelectorAll('script').forEach(oldScript => {
                                    const newScript = document.createElement('script');
                                    if (oldScript.src) newScript.src = oldScript.src;
                                    else newScript.textContent = oldScript.textContent;
                                    document.body.appendChild(newScript);
                                });
                            }).catch(error => alert("Failed to load zone: " + error));
                        }
                    } else {
                        openZone(zone);
                    }
                }
            }
        } catch(error) {}
        let alltags = [];
        for (const obj of json) {
            if (Array.isArray(obj.special)) alltags.push(...obj.special);
        }
        alltags = [...new Set(alltags)];
        let filteroption = document.getElementById("filterOptions");
        if (filteroption && filteroption.children.length > 1) {
            while (filteroption.children.length > 1) filteroption.removeChild(filteroption.lastElementChild);
        }
        for (const tag of alltags) {
            const opt = document.createElement("option");
            opt.value = tag;
            opt.textContent = toTitleCase(tag);
            filteroption.appendChild(opt);
        }
    } catch(error) {
        console.error(error);
        container.innerHTML = `Error loading zones: ${error}`;
    }
}

async function fetchPopularity(duration) {
    try {
        if (!popularityData[duration]) popularityData[duration] = {};
        const response = await fetch("https://data.jsdelivr.com/v1/stats/packages/gh/freebuisness/html@main/files?period=" + duration);
        const data = await response.json();
        data.forEach(file => {
            const idMatch = file.name.match(/\/(\d+)\.html$/);
            if (idMatch) {
                const id = parseInt(idMatch[1]);
                popularityData[duration][id] = file.hits?.total ?? 0;
            }
        });
    } catch(error) {
        if (!popularityData[duration]) popularityData[duration] = {};
        popularityData[duration][0] = 0;
    }
}

function sortZones() {
    const sortBy = sortOptions.value;
    if (sortBy === 'name') zones.sort((a, b) => a.name.localeCompare(b.name));
    else if (sortBy === 'id') zones.sort((a, b) => a.id - b.id);
    else if (sortBy === 'popular') zones.sort((a, b) => ((popularityData['year']?.[b.id]) ?? 0) - ((popularityData['year']?.[a.id]) ?? 0));
    else if (sortBy === 'trendingMonth') zones.sort((a, b) => ((popularityData['month']?.[b.id]) ?? 0) - ((popularityData['month']?.[a.id]) ?? 0));
    else if (sortBy === 'trendingWeek') zones.sort((a, b) => ((popularityData['week']?.[b.id]) ?? 0) - ((popularityData['week']?.[a.id]) ?? 0));
    else if (sortBy === 'trendingDay') zones.sort((a, b) => ((popularityData['day']?.[b.id]) ?? 0) - ((popularityData['day']?.[a.id]) ?? 0));
    zones.sort((a, b) => (a.id === -1 ? -1 : b.id === -1 ? 1 : 0));
    if (featuredContainer.innerHTML === "") {
        const featured = zones.filter(z => z.featured);
        displayFeaturedZones(featured);
    }
    displayZones(zones);
}

function displayFeaturedZones(featuredZones) {
    featuredContainer.innerHTML = "";
    featuredZones.forEach(file => {
        const zoneItem = document.createElement("div");
        zoneItem.className = "zone-item";
        zoneItem.onclick = () => openZone(file);

        // play badge
        const localPlay = getLocalPlay(file.id);
        if (localPlay && localPlay.count > 0) {
            const badge = document.createElement("div");
            badge.className = "play-badge";
            badge.textContent = `▶ ${localPlay.count}`;
            zoneItem.appendChild(badge);
        }

        const img = document.createElement("img");
        img.dataset.src = file.cover.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
        img.alt = file.name;
        img.loading = "lazy";
        img.className = "lazy-zone-img";
        zoneItem.appendChild(img);

        const button = document.createElement("button");
        button.textContent = file.name;
        button.onclick = (event) => { event.stopPropagation(); openZone(file); };
        zoneItem.appendChild(button);
        featuredContainer.appendChild(zoneItem);
    });

    if (featuredContainer.innerHTML === "") {
        featuredContainer.innerHTML = "No featured zones found.";
    } else {
        document.getElementById("allZonesSummary").textContent = `Featured Zones (${featuredZones.length})`;
    }

    const lazyImages = document.querySelectorAll('#featuredZones img.lazy-zone-img');
    const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting && !zoneViewer.hidden) {
                const img = entry.target;
                img.src = img.dataset.src;
                img.classList.remove("lazy-zone-img");
                observer.unobserve(img);
            }
        });
    }, { rootMargin: "100px", threshold: 0.1 });
    lazyImages.forEach(img => imageObserver.observe(img));
}

function displayZones(zones) {
    container.innerHTML = "";
    zones.forEach(file => {
        const zoneItem = document.createElement("div");
        zoneItem.className = "zone-item";
        zoneItem.onclick = () => openZone(file);

        // play badge
        const localPlay = getLocalPlay(file.id);
        if (localPlay && localPlay.count > 0) {
            const badge = document.createElement("div");
            badge.className = "play-badge";
            badge.textContent = `▶ ${localPlay.count}`;
            zoneItem.appendChild(badge);
        }

        const img = document.createElement("img");
        img.dataset.src = file.cover.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
        img.alt = file.name;
        img.loading = "lazy";
        img.className = "lazy-zone-img";
        zoneItem.appendChild(img);

        const button = document.createElement("button");
        button.textContent = file.name;
        button.onclick = (event) => { event.stopPropagation(); openZone(file); };
        zoneItem.appendChild(button);
        container.appendChild(zoneItem);
    });

    if (container.innerHTML === "") {
        container.innerHTML = "No zones found.";
    } else {
        document.getElementById("allSummary").textContent = `All Zones (${zones.length})`;
    }

    const lazyImages = document.querySelectorAll('img.lazy-zone-img');
    const imageObserver = new IntersectionObserver((entries, observer) => {
        entries.forEach(entry => {
            if (entry.isIntersecting && !zoneViewer.hidden) {
                const img = entry.target;
                img.src = img.dataset.src;
                img.classList.remove("lazy-zone-img");
                observer.unobserve(img);
            }
        });
    }, { rootMargin: "100px", threshold: 0.1 });
    lazyImages.forEach(img => imageObserver.observe(img));
}

function filterZones2() {
    const query = filterOptions.value;
    if (query === "none") {
        displayZones(zones);
    } else {
        const filteredZones = zones.filter(zone => zone.special?.includes(query));
        if (query.length !== 0) document.getElementById("featuredZonesWrapper").removeAttribute("open");
        displayZones(filteredZones);
    }
}

function filterZones() {
    const query = searchBar.value.toLowerCase();
    const filteredZones = zones.filter(zone => zone.name.toLowerCase().includes(query));
    if (query.length !== 0) document.getElementById("featuredZonesWrapper").removeAttribute("open");
    displayZones(filteredZones);
}

function openZone(file) {
    if (file.url.startsWith("http")) {
        recordPlay(file.id, file.name);
        window.open(file.url, "_blank");
    } else {
        const url = file.url.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
        fetch(url + "?t=" + Date.now()).then(response => response.text()).then(html => {
            recordPlay(file.id, file.name);
            // Read saved game data from parent localStorage synchronously.
            // Embed it as a JSON literal inside the proxy — cache is populated
            // at script parse time, before the game's first line executes.
            const savedData = getSavedGameData(file.id);
            const proxyScript = buildLocalStorageProxy(file.id, savedData);
            const injected = html.replace(/(<html[^>]*>)/i, '$1' + proxyScript)
                              || (proxyScript + html);
            // Always remove and recreate the iframe — guarantees a clean
            // document every open. postMessage handler is on window, not the
            // iframe, so saves still work after the old frame is gone.
            if (zoneFrame && zoneFrame.parentNode) {
                zoneFrame.parentNode.removeChild(zoneFrame);
            }
            zoneFrame = document.createElement("iframe");
            zoneFrame.id = "zoneFrame";
            zoneFrame.style.cssText = "flex-grow:1;border:none;width:90%;height:90%;";
            zoneViewer.appendChild(zoneFrame);
            zoneFrame.contentDocument.open();
            zoneFrame.contentDocument.write(injected);
            zoneFrame.contentDocument.close();
            document.getElementById('zoneName').textContent = file.name;
            document.getElementById('zoneId').textContent = file.id;
            document.getElementById('zoneAuthor').textContent = "by " + file.author;
            if (file.authorLink) document.getElementById('zoneAuthor').href = file.authorLink;
            _activeZoneId = file.id;
            startSnapshotPolling();
            zoneViewer.style.display = "flex";
            try {
                const urlObj = new URL(window.location);
                urlObj.searchParams.set('id', file.id);
                history.pushState(null, '', urlObj.toString());
            } catch(error) {}
        }).catch(error => alert("Failed to load zone: " + error));
    }
}

function aboutBlank() {
    const newWindow = window.open("about:blank", "_blank");
    let zone = zones.find(zone => zone.id + '' === document.getElementById('zoneId').textContent).url.replace("{COVER_URL}", coverURL).replace("{HTML_URL}", htmlURL);
    fetch(zone + "?t=" + Date.now()).then(response => response.text()).then(html => {
        if (newWindow) {
            newWindow.document.open();
            newWindow.document.write(html);
            newWindow.document.close();
        }
    });
}

function closeZone() {
    requestSnapshot();        // final snapshot before hiding
    stopSnapshotPolling();
    _activeZoneId = null;
    zoneViewer.style.display = "none";
    displayZones(zones);
    try {
        const url = new URL(window.location);
        url.searchParams.delete('id');
        history.pushState(null, '', url.toString());
    } catch(error) {}
}

function downloadZone() {

function sanitizeData(obj, maxStringLen = 1000, maxArrayLen = 10000) {
    if (typeof obj === 'string') return obj.length > maxStringLen ? obj.slice(0, maxStringLen) + '...[truncated]' : obj;
    if (obj instanceof Uint8Array) return obj.length > maxArrayLen ? `[Uint8Array too large (${obj.length} bytes), truncated]` : obj;
    if (Array.isArray(obj)) return obj.map(item => sanitizeData(item, maxStringLen, maxArrayLen));
    if (obj && typeof obj === 'object') {
        const newObj = {};
        for (const key in obj) { if (obj.hasOwnProperty(key)) newObj[key] = sanitizeData(obj[key], maxStringLen, maxArrayLen); }
        return newObj;
    }
    return obj;
}

async function saveData() {
    alert("This might take a while, dont touch anything other than this OK button");
    const result = {};
    result.playHistory = getPlayStats();
    result.cookies = document.cookie;
    result.localStorage = {...localStorage};
    result.sessionStorage = {...sessionStorage};
    result.indexedDB = {};
    const dbs = await indexedDB.databases();
    for (const dbInfo of dbs) {
        if (!dbInfo.name) continue;
        result.indexedDB[dbInfo.name] = {};
        await new Promise((resolve, reject) => {
            const openRequest = indexedDB.open(dbInfo.name, dbInfo.version);
            openRequest.onerror = () => reject(openRequest.error);
            openRequest.onsuccess = () => {
                const db = openRequest.result;
                const storeNames = Array.from(db.objectStoreNames);
                if (storeNames.length === 0) { resolve(); return; }
                const transaction = db.transaction(storeNames, "readonly");
                const storePromises = [];
                for (const storeName of storeNames) {
                    result.indexedDB[dbInfo.name][storeName] = [];
                    const store = transaction.objectStore(storeName);
                    const getAllRequest = store.getAll();
                    const p = new Promise((res, rej) => {
                        getAllRequest.onsuccess = () => {
                            result.indexedDB[dbInfo.name][storeName] = sanitizeData(getAllRequest.result, 1000, 100);
                            res();
                        };
                        getAllRequest.onerror = () => rej(getAllRequest.error);
                    });
                    storePromises.push(p);
                }
                Promise.all(storePromises).then(() => resolve());
            };
        });
    }
    result.caches = {};
    const cacheNames = await caches.keys();
    for (const cacheName of cacheNames) {
        const cache = await caches.open(cacheName);
        const requests = await cache.keys();
        result.caches[cacheName] = [];
        for (const req of requests) {
            const response = await cache.match(req);
            if (!response) continue;
            const cloned = response.clone();
            const contentType = cloned.headers.get('content-type') || '';
            let body;
            try {
                if (contentType.includes('application/json')) body = await cloned.json();
                else if (contentType.includes('text') || contentType.includes('javascript')) body = await cloned.text();
                else {
                    const buffer = await cloned.arrayBuffer();
                    body = btoa(String.fromCharCode(...new Uint8Array(buffer)));
                }
            } catch(e) { body = '[Unable to read body]'; }
            result.caches[cacheName].push({ url: req.url, body, contentType });
        }
    }
    alert("Done, wait for the download to come");
    const link = document.createElement("a");
    link.href = URL.createObjectURL(new Blob([JSON.stringify(result)], { type: "application/octet-stream" }));
    link.download = `${Date.now()}.data`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
}

async function loadData(event) {
    const file = event.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = async function(e) {
        const data = JSON.parse(e.target.result);
        if (data.cookies) data.cookies.split(';').forEach(cookie => { document.cookie = cookie.trim(); });
        if (data.localStorage) { for (const key in data.localStorage) localStorage.setItem(key, data.localStorage[key]); }
        if (data.sessionStorage) { for (const key in data.sessionStorage) sessionStorage.setItem(key, data.sessionStorage[key]); }
        if (data.indexedDB) {
            for (const dbName in data.indexedDB) {
                const stores = data.indexedDB[dbName];
                await new Promise((resolve, reject) => {
                    const request = indexedDB.open(dbName, 1);
                    request.onupgradeneeded = e => {
                        const db = e.target.result;
                        for (const storeName in stores) {
                            if (!db.objectStoreNames.contains(storeName)) db.createObjectStore(storeName, { keyPath: 'id', autoIncrement: true });
                        }
                    };
                    request.onsuccess = e => {
                        const db = e.target.result;
                        const transaction = db.transaction(Object.keys(stores), 'readwrite');
                        transaction.onerror = () => reject(transaction.error);
                        let pendingStores = Object.keys(stores).length;
                        for (const storeName in stores) {
                            const objectStore = transaction.objectStore(storeName);
                            objectStore.clear().onsuccess = () => {
                                for (const item of stores[storeName]) objectStore.put(item);
                                pendingStores--;
                                if (pendingStores === 0) resolve();
                            };
                        }
                    };
                    request.onerror = () => reject(request.error);
                });
            }
        }
        if (data.caches) {
            for (const cacheName in data.caches) {
                const cache = await caches.open(cacheName);
                await cache.keys().then(keys => Promise.all(keys.map(k => cache.delete(k))));
                for (const entry of data.caches[cacheName]) {
                    let responseBody;
                    if (entry.contentType.includes('application/json')) responseBody = JSON.stringify(entry.body);
                    else if (entry.contentType.includes('text') || entry.contentType.includes('javascript')) responseBody = entry.body;
                    else {
                        const binaryStr = atob(entry.body);
                        const bytes = new Uint8Array(binaryStr.length);
                        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);
                        responseBody = bytes.buffer;
                    }
                    const headers = new Headers({ 'content-type': entry.contentType });
                    await cache.put(entry.url, new Response(responseBody, { headers }));
                }
            }
        }
        alert("Data loaded");
    };
    alert("This might take a while, dont touch anything other than this OK button");
    reader.readAsText(file);
}

let _allStatsCache = null;

async function getAllStats() {
    if (_allStatsCache) return _allStatsCache;
    const BASE_URL = "https://data.jsdelivr.com/v1/stats/packages/gh/freebuisness/html@main/files";
    const PERIOD = "year";
    const PAGE_BATCH = 5;
    let page = 1, done = false;
    const combinedMap = Object.create(null);
    while (!done) {
        const pages = Array.from({ length: PAGE_BATCH }, (_, i) => page + i);
        const responses = await Promise.all(
            pages.map(p => fetch(`${BASE_URL}?period=${PERIOD}&page=${p}&limit=100`).then(r => (r.ok ? r.json() : [])))
        );
        for (const data of responses) {
            if (!Array.isArray(data) || data.length === 0) { done = true; break; }
            for (const item of data) {
                if (!item?.name) continue;
                const match = item.name.match(/^\/(\d+)([.-])/);
                if (!match) continue;
                const id = match[1];
                if (!combinedMap[id]) combinedMap[id] = { hits: 0, bandwidth: 0 };
                combinedMap[id].hits += item.hits?.total ?? 0;
                combinedMap[id].bandwidth += item.bandwidth?.total ?? 0;
            }
        }
        page += PAGE_BATCH;
    }
    _allStatsCache = combinedMap;
    return combinedMap;
}

async function getStats(id) {
    id = String(id);
    const allStats = await getAllStats();
    return allStats[id]?.hits ?? 0;
}
